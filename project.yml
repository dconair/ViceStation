name: ViceStation
options:
  bundleIdPrefix: com.vicestation
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ViceStation:
    type: application
    platform: iOS
    sources:
      - ViceStation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vicestation.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: DEINE_TEAM_ID
    info:
      path: ViceStation/Info.plist
      properties:
        CFBundleDisplayName: ViceStation
        UILaunchScreen:
          UIColorName: ""
        UIBackgroundModes: [audio]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        NSPhotoLibraryUsageDescription: "Damit du ein eigenes Senderlogo aus deinen Fotos wählen kannst."
